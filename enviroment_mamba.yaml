name: HAC_mamba_env
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # ---- Python base ----
  - python=3.10
  - pip=23.3

  # ---- PyTorch + CUDA ----
  - pytorch=2.1.0
  - torchvision=0.16.0
  - torchaudio=2.1.0
  - pytorch-cuda=11.8

  # ---- Build toolchain ----
  - ninja
  - cmake
  - gxx_linux-64=11     # C++17 対応の g++

  # ---- Utils ----
  - tqdm
  - plyfile

  # ---- pip から入れても安全な（ビルド不要 or ホイールあり）もの ----
  - pip:
      - einops
      - wandb
      - lpips
